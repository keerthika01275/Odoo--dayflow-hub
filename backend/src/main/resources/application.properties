spring.application.name=backend
server.port=8080

# Database Configuration (H2 in MySQL mode for zero-config local dev)
spring.datasource.url=${DB_URL:jdbc:h2:mem:dayflow;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Enable H2 Console for DB inspection during dev
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=${JWT_SECRET:dayflow-super-secret-key-must-be-at-least-32-chars-long-for-HS256}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging
logging.level.com.dayflow=INFO
