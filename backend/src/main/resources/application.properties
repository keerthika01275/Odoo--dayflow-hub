spring.application.name=backend
server.port=${PORT:8080}

# =============================================================
# DATABASE CONFIGURATION
# Local default: H2 file-based (persistent, zero setup)
# Production (Render): set DB_URL, DB_DRIVER, DB_USERNAME, DB_PASSWORD
#   DB_URL      = jdbc:postgresql://<host>:5432/<dbname>
#   DB_DRIVER   = org.postgresql.Driver
#   DB_USERNAME = <render_db_user>
#   DB_PASSWORD = <render_db_password>
# =============================================================
spring.datasource.url=${DB_URL:jdbc:h2:file:./dayflow-db;MODE=MySQL}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:Dayflow@2024}

# H2 Console (disabled automatically when using PostgreSQL)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JPA / Hibernate Configuration
# dialect auto-detected from driver; override only for H2 local dev
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# JWT Configuration
jwt.secret=${JWT_SECRET:dayflow-super-secret-key-must-be-at-least-32-chars-long-for-HS256}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS — add your Vercel URL here via environment variable
# e.g. ALLOWED_ORIGINS=https://dayflow.vercel.app,https://*.vercel.app
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

# Jackson — serialize dates as ISO strings (not timestamp arrays)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=Asia/Kolkata

# Logging
logging.level.com.dayflow=INFO
