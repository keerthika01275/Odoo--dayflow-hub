<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo-box">D</div>
      <h2>DAYFLOW</h2>
      <p class="tagline">Every workday, perfectly aligned.</p>
    </div>

    <div *ngIf="errorMessage" class="error-banner">
      <span>⚠️ {{ errorMessage }}</span>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Official Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="name@company.com"
          [class.invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
        />
        <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="field-error">
          Please enter a valid email address.
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="••••••••"
          [class.invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
        />
        <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="field-error">
          Password is required.
        </div>
      </div>

      <button type="submit" class="btn-submit" [disabled]="loginForm.invalid || loading">
        <span *ngIf="!loading">Sign In to Dayflow</span>
        <span *ngIf="loading">Signing in...</span>
      </button>
    </form>

    <div class="demo-section">
      <p class="demo-title">⚡ Instant Demo Login:</p>
      <div class="demo-buttons">
        <button type="button" class="btn-demo admin" (click)="fillDemoCredentials('ADMIN')">Admin</button>
        <button type="button" class="btn-demo hr" (click)="fillDemoCredentials('HR')">HR</button>
        <button type="button" class="btn-demo employee" (click)="fillDemoCredentials('EMPLOYEE')">Employee</button>
      </div>
    </div>

    <div class="auth-footer">
      <p>Have an assigned Employee ID? <a routerLink="/register">Register Dayflow Account</a></p>
    </div>
  </div>
</div>
