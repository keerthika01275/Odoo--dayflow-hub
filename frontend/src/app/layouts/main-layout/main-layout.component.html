<div class="layout-wrapper">
  <!-- Top Navigation Bar -->
  <header class="topbar">
    <div class="topbar-left">
      <button class="mobile-toggle" (click)="toggleMobileMenu()">
        <span class="material-icons">menu</span>
      </button>
      <div class="brand">
        <div class="brand-icon">D</div>
        <span class="brand-name">DAYFLOW</span>
      </div>
    </div>

    <div class="topbar-right">
      <!-- Notification Bell -->
      <div class="notification-wrapper">
        <button class="btn-icon" id="notification-bell-btn" (click)="toggleNotificationMenu()" title="Notifications">
          <span class="material-icons">notifications</span>
          <span class="notification-badge" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
        </button>

        <!-- Dropdown Tray -->
        <div class="notification-dropdown" *ngIf="notificationOpen">
          <div class="dropdown-header">
            <span class="dropdown-title">Notifications</span>
            <button class="mark-read-btn" (click)="markAllAsRead()">Mark all as read</button>
          </div>

          <div class="notification-list">
            <div class="notification-item" *ngFor="let notif of notifications" [class.unread]="!notif.read">
              <div class="notif-icon">
                <span class="material-icons">{{ notif.icon }}</span>
              </div>
              <div class="notif-content">
                <div class="notif-title">{{ notif.title }}</div>
                <div class="notif-msg">{{ notif.message }}</div>
                <div class="notif-time">{{ notif.time }}</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="user-badge-container">
        <span class="role-chip" [ngClass]="role?.toLowerCase()">{{ role }}</span>
        <div class="user-info">
          <span class="user-name">{{ currentUser?.firstName }} {{ currentUser?.lastName }}</span>
          <span class="user-email">{{ currentUser?.email }}</span>
        </div>
      </div>
      <button class="btn-logout" (click)="logout()" title="Logout">
        <span class="material-icons">logout</span>
        <span class="logout-text">Logout</span>
      </button>
    </div>
  </header>

  <div class="layout-body">
    <!-- Sidebar -->
    <aside class="sidebar" [class.open]="mobileMenuOpen">
      <div class="sidebar-header">
        <span class="section-title">
          <ng-container [ngSwitch]="role">
            <span *ngSwitchCase="'EMPLOYEE'">MY WORKDAY</span>
            <span *ngSwitchCase="'HR'">PEOPLE OPERATIONS</span>
            <span *ngSwitchCase="'ADMIN'">CONTROL CENTER</span>
          </ng-container>
        </span>
      </div>

      <nav class="nav-menu">
        <a
          *ngFor="let item of navItems"
          [routerLink]="item.route"
          routerLinkActive="active"
          class="nav-item"
          (click)="mobileMenuOpen = false"
        >
          <span class="material-icons nav-icon">{{ item.icon }}</span>
          <span class="nav-label">{{ item.label }}</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="app-version">DAYFLOW Enterprise v1.0</div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
