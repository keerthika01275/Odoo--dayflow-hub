services:
  # Spring Boot Backend (Docker)
  - type: web
    name: dayflow-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DB_URL
        fromDatabase:
          name: dayflow-postgres
          property: connectionString
      - key: DB_DRIVER
        value: org.postgresql.Driver
      - key: DB_USERNAME
        fromDatabase:
          name: dayflow-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: dayflow-postgres
          property: password
      - key: JPA_DIALECT
        value: org.hibernate.dialect.PostgreSQLDialect
      - key: H2_CONSOLE_ENABLED
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://dayflow-frontend.vercel.app

# PostgreSQL Database
databases:
  - name: dayflow-postgres
    plan: free
