services:
  # Spring Boot Backend
  - type: web
    name: dayflow-backend
    runtime: java
    buildCommand: cd backend && ./mvnw clean package -DskipTests
    startCommand: java -jar backend/target/backend-0.0.1-SNAPSHOT.jar
    envVars:
      - key: PORT
        value: 8080
      - key: DB_URL
        fromDatabase:
          name: dayflow-postgres
          property: connectionString
      - key: DB_DRIVER
        value: org.postgresql.Driver
      - key: DB_USERNAME
        fromDatabase:
          name: dayflow-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: dayflow-postgres
          property: password
      - key: JPA_DIALECT
        value: org.hibernate.dialect.PostgreSQLDialect
      - key: H2_CONSOLE_ENABLED
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://dayflow-frontend.vercel.app
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update

  # PostgreSQL Database
databases:
  - name: dayflow-postgres
    plan: free
