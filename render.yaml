services:
  # Spring Boot Backend (Docker)
  - type: web
    name: dayflow-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      # Set these manually in Render dashboard using your Neon.tech credentials
      - key: DB_URL
        sync: false
      - key: DB_DRIVER
        value: org.postgresql.Driver
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JPA_DIALECT
        value: org.hibernate.dialect.PostgreSQLDialect
      - key: H2_CONSOLE_ENABLED
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
